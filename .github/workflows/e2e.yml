name: Reupmatic E2E
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"
permissions:
  contents: read
concurrency:
  group: reupmatic-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  electron-ui:
    name: Electron UI / Linux integration
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version
      - name: Native test dependencies
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg xvfb libgtk-3-0 libnss3 libasound2t64
      - run: python -m pip install -r worker/requirements-dev.txt
      - run: pnpm install --frozen-lockfile
        env:
          LEFTHOOK: "0"
      - run: xvfb-run -a pnpm run test:e2e
